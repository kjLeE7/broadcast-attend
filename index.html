<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>방송예술과</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <!-- 파일을 고친 뒤 텔레그램에서 옛날 화면이 보이면 아래 v= 숫자를 바꿔주세요 -->
  <link rel="stylesheet" href="style.css?v=20260921">
</head>
<body>
  <div class="app">

    <!-- ===== 상단 헤더 ===== -->
    <header class="topbar">
      <div class="brand">
        <div class="logo">방</div>
        <div>
          <div class="brand-title">방송예술과</div>
          <div class="brand-sub" id="greeting">반가워요 👋</div>
        </div>
      </div>
      <button class="avatar" id="avatar" onclick="goTab('attend')" aria-label="내 정보">?</button>
    </header>

    <!-- ===== 홈(대시보드) ===== -->
    <section class="page active" id="page-home">
      <h1 class="page-title">Overview</h1>
      <p class="page-desc" id="todayText"></p>

      <div class="stats">
        <div class="stat">
          <div class="stat-label">진행 중</div>
          <div class="stat-value" id="statNow">–</div>
        </div>
        <div class="stat">
          <div class="stat-label">예정된 모임</div>
          <div class="stat-value" id="statUpcoming">–</div>
        </div>
        <div class="stat">
          <div class="stat-label">다음 모임</div>
          <div class="stat-value" id="statNext">–</div>
        </div>
      </div>

      <div class="section-head">
        <h2>지금 진행 중</h2>
        <span class="live-dot" id="liveDot"></span>
      </div>
      <div id="nowArea">
        <div class="skeleton hero-skel"></div>
      </div>

      <div class="section-head">
        <h2>예정된 일정</h2>
        <span class="section-count" id="upcomingCount"></span>
      </div>
      <div id="upcomingArea">
        <div class="skeleton row-skel"></div>
        <div class="skeleton row-skel"></div>
      </div>

      <div id="debug" class="debug"></div>
    </section>

    <!-- ===== 출결 ===== -->
    <section class="page" id="page-attend">
      <h1 class="page-title">Attendance</h1>
      <p class="page-desc">모임 출결을 남겨주세요</p>

      <div class="card">
        <div id="welcome" class="welcome"></div>

        <label class="field-label" for="classSelect">모임 선택</label>
        <div class="select-wrap"><select id="classSelect"></select></div>

        <div id="manualSelectBlock">
          <label class="field-label" for="personSelect">본인 이름</label>
          <div class="select-wrap"><select id="personSelect"></select></div>
          <label class="checkbox-row" id="rememberRow">
            <input type="checkbox" id="rememberMe" checked>
            <span>다음부터 자동으로 알아보기</span>
          </label>
        </div>

        <label class="field-label">참석 여부</label>
        <div class="segmented">
          <input type="radio" name="status" id="st1" value="참석" checked><label for="st1">참석</label>
          <input type="radio" name="status" id="st2" value="불참"><label for="st2">불참</label>
          <input type="radio" name="status" id="st3" value="지각"><label for="st3">지각</label>
        </div>

        <label class="field-label" for="reason">사유 <span class="hint">불참·지각 시 작성</span></label>
        <textarea id="reason" rows="3" placeholder="예) 회사 야근으로 30분 늦어요"></textarea>

        <button class="btn-primary" id="submitBtn" onclick="submitForm()">출결 제출</button>
        <div id="msg" class="msg"></div>
      </div>
    </section>

    <!-- ===== 공지 만들기 (교관 이상) ===== -->
    <section class="page" id="page-notice">
      <h1 class="page-title">New Meeting</h1>
      <p class="page-desc">교관 이상만 볼 수 있는 메뉴예요</p>

      <div class="card">
        <label class="field-label" for="noticeTypeSelect">모임유형</label>
        <div class="select-wrap"><select id="noticeTypeSelect"></select></div>

        <label class="field-label" for="noticeDatetime">일시</label>
        <input type="datetime-local" id="noticeDatetime">

        <label class="field-label" for="noticePlace">장소</label>
        <div class="select-wrap">
          <select id="noticePlace">
            <option value="">장소를 선택하세요</option>
            <option value="스담">스담</option>
            <option value="총회 사무실">총회 사무실</option>
            <option value="SMC">SMC</option>
            <option value="코드원 스튜디오">코드원 스튜디오</option>
            <option value="벽산 편집실">벽산 편집실</option>
            <option value="과천성전(9층)">과천성전(9층)</option>
            <option value="과천성전(10층)">과천성전(10층)</option>
          </select>
        </div>

        <button class="btn-primary" id="noticeSubmitBtn" onclick="submitNotice()">공지 저장</button>
        <div id="adminMsg" class="msg"></div>
      </div>
    </section>

    <!-- ===== 하단 탭 ===== -->
    <nav class="tabbar">
      <button class="tab active" data-tab="home" onclick="goTab('home')">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>홈</span>
      </button>
      <button class="tab" data-tab="attend" onclick="goTab('attend')">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 2v4M16 2v4M8.5 13.5l2.5 2.5 4.5-5"/></svg>
        <span>출결</span>
      </button>
      <button class="tab" data-tab="notice" id="noticeTab" onclick="goTab('notice')" style="display:none;">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        <span>공지</span>
      </button>
    </nav>
  </div>

  <script src="app.js?v=20260921"></script>
</body>
</html>
